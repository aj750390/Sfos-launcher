name: Build Sailfish Android Launcher APK

on:
push:
branches:
- "**"
pull_request:
workflow_dispatch:

permissions:
contents: read

jobs:
build-apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.7"

  - name: Normalize Android project structure
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p app/src/main/java/org/sailfish/launcher

      # Locate the launcher Kotlin source if it is outside
      # the expected package directory.
      TARGET="app/src/main/java/org/sailfish/launcher/SailfishLauncher.kt"

      if [ ! -f "$TARGET" ]; then
        FOUND_KT="$(find . -type f -name SailfishLauncher.kt \
          -not -path './.git/*' \
          -not -path './app/build/*' | head -n 1 || true)"

        if [ -n "$FOUND_KT" ]; then
          cp "$FOUND_KT" "$TARGET"
          echo "Copied launcher source from $FOUND_KT"
        else
          echo "::error::SailfishLauncher.kt was not found in the repository."
          exit 1
        fi
      fi

      # Keep the existing launcher implementation intact.
      # Do not apply potentially unsafe automatic Kotlin rewrites.

      cat > gradle.properties <<'EOF'
      org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
      android.useAndroidX=true
      android.nonTransitiveRClass=true
      kotlin.code.style=official
      EOF

      cat > settings.gradle.kts <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = "SailfishAndroidLauncher"
      include(":app")
      EOF

      cat > build.gradle.kts <<'EOF'
      plugins {
          id("com.android.application") version "8.5.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.24" apply false
      }
      EOF

      cat > app/build.gradle.kts <<'EOF'
      plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
      }

      android {
          namespace = "org.sailfish.launcher"
          compileSdk = 34

          defaultConfig {
              applicationId = "org.sailfish.launcher"
              minSdk = 26
              targetSdk = 34
              versionCode = 1
              versionName = "1.0.0-silica"
          }

          buildFeatures {
              compose = true
          }

          composeOptions {
              kotlinCompilerExtensionVersion = "1.5.14"
          }

          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }
      }

      dependencies {
          val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
          implementation(composeBom)

          implementation("androidx.core:core-ktx:1.13.1")
          implementation("androidx.activity:activity-compose:1.9.0")

          implementation("androidx.compose.ui:ui")
          implementation("androidx.compose.ui:ui-tooling-preview")
          implementation("androidx.compose.foundation:foundation")
          implementation("androidx.compose.material3:material3")
          implementation("androidx.compose.material:material-icons-extended")
          implementation("androidx.palette:palette-ktx:1.0.0")
      }
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android"
          xmlns:tools="http://schemas.android.com/tools">

          <uses-permission
              android:name="android.permission.QUERY_ALL_PACKAGES"
              tools:ignore="QueryAllPackagesPermission" />

          <uses-permission
              android:name="android.permission.PACKAGE_USAGE_STATS"
              tools:ignore="ProtectedPermissions" />

          <uses-permission
              android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />

          <uses-permission
              android:name="android.permission.VIBRATE" />

          <application
              android:allowBackup="true"
              android:label="Sailfish Launcher"
              android:supportsRtl="true"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:launchMode="singleTask"
                  android:clearTaskOnLaunch="true"
                  android:stateNotNeeded="true"
                  android:screenOrientation="portrait"
                  android:windowSoftInputMode="adjustResize">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                      <category android:name="android.intent.category.DEFAULT" />
                  </intent-filter>

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>

              <service
                  android:name=".SailfishNotificationBridge"
                  android:exported="true"
                  android:label="Sailfish Notification Bridge"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">

                  <intent-filter>
                      <action
                          android:name="android.service.notification.NotificationListenerService" />
                  </intent-filter>
              </service>

          </application>
      </manifest>
      EOF

  - name: Verify required Kotlin source files
    shell: bash
    run: |
      set -euo pipefail

      for FILE in \
        app/src/main/java/org/sailfish/launcher/MainActivity.kt \
        app/src/main/java/org/sailfish/launcher/SailfishLauncher.kt \
        app/src/main/java/org/sailfish/launcher/SailfishNotificationBridge.kt
      do
        if [ ! -f "$FILE" ]; then
          echo "::warning::Expected source file not found: $FILE"
        fi
      done

  - name: Build Debug APK
    run: gradle assembleDebug --no-daemon --console=plain

  - name: Upload Compiled APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: sailfish-launcher-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
