name: Build Sailfish Android Launcher APK

on:
  push:
    branches:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root" -type f -name sdkmanager -print -quit)"

          if [[ -z "$sdkmanager_path" ]]; then
            echo "Could not find sdkmanager under: $sdk_root" >&2
            exit 1
          fi

          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Normalize and repair Android project structure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/org/sailfish/launcher

          # If SailfishLauncher.kt was uploaded to the repository root or another
          # directory, copy it into the expected package directory.
          if [[ ! -f "app/src/main/java/org/sailfish/launcher/SailfishLauncher.kt" ]]; then
            found_kt="$(find . -type f -name "SailfishLauncher.kt" -not -path "./app/src/main/java/org/sailfish/launcher/SailfishLauncher.kt" -print -quit)"
            if [[ -n "$found_kt" ]]; then
              cp "$found_kt" "app/src/main/java/org/sailfish/launcher/SailfishLauncher.kt"
            fi
          fi

          # Patch known Compose API incompatibilities.
          python3 - <<'PY'
          import re
          from pathlib import Path

          kt_path = Path("app/src/main/java/org/sailfish/launcher/SailfishLauncher.kt")

          if kt_path.exists():
              source = kt_path.read_text(encoding="utf-8", errors="ignore")
              source = source.replace("Icons.Default.PushPin", "Icons.Default.Star")
              source = source.replace(
                  "HapticFeedbackType.TextHandleMove",
                  "HapticFeedbackType.LongPress",
              )
              source = source.replace("mutableFloatStateOf(", "mutableStateOf(")
              source = source.replace("mutableIntStateOf(", "mutableStateOf(")
              source = source.replace(
                  ".animateToPage(",
                  ".animateScrollToPage(",
              )
              source = source.replace(
                  "import androidx.compose.foundation.pager.animateScrollToPage\n",
                  "",
              )
              source = source.replace(
                  "import androidx.compose.animation.core.Animatable\n",
                  "",
              )
              source = source.replace(
                  "val remorseProgress = remember { Animatable(1f) }",
                  "val remorseProgress = remember { mutableStateOf(1f) }",
              )
              source = source.replace(
                  "remorseProgress.snapTo(1f)",
                  "remorseProgress.value = 1f",
              )
              source = re.sub(
                  r"remorseProgress\.animateTo\([^)]+\)",
                  "delay(5000L); remorseProgress.value = 0f",
                  source,
              )
              source = re.sub(
                  r"LinearProgressIndicator\(\s*progress\s*=\s*\{\s*remorseProgress\.value\s*\},",
                  "LinearProgressIndicator(progress = remorseProgress.value,",
                  source,
              )
              kt_path.write_text(source, encoding="utf-8")
          PY

          # Ensure Gradle properties exist and AndroidX is enabled.
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # Ensure the Gradle settings file exists.
          cat > settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SailfishAndroidLauncher"
          include(":app")
          EOF

          # Ensure the root Gradle file contains the required plugin declarations.
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # Ensure the app module is properly configured.
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "org.sailfish.launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "org.sailfish.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-silica"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.palette:palette-ktx:1.0.0")
          }
          EOF

          # Ensure the Android manifest exists.
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />
              <uses-permission
                  android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="Sailfish Launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SailfishNotificationBridge"
                      android:exported="true"
                      android:label="Sailfish Active Covers &amp; Events Bridge"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Upload compiled APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sailfish-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
